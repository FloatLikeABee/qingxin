openapi: 3.1.0
info:
  title: Qingxin (轻心) API
  version: 0.1.0
  description: |
    T1 Foundation HTTP contract for Qingxin.

    The Rust service lives in `api/`. Sensitive fields (phone numbers and
    finance transaction notes) are stored with AES-256-GCM. Access tokens
    are short-lived JWTs; refresh tokens and caregiver-issued device
    sessions are opaque, hashed, and revocable. M2 finance lives at
    `/v1/finance` (CNY fen amounts stay plaintext).

    AI generation is intentionally a seam: `POST /v1/ai/complete` is reserved
    for Echo's gateway and returns `ai_unconfigured` until that crate is
    wired. Moderation is an in-process trait (no-op stub) and is not exposed
    as a public route in T1.
  license:
    name: UNLICENSED
servers:
  - url: http://127.0.0.1:8080
    description: Local development
security: []
tags:
  - name: Health
  - name: Auth
  - name: Me
  - name: Privacy
  - name: Caregiver
  - name: Devices
  - name: Push
  - name: Jobs
  - name: AI
  - name: Finance
paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness and database readiness
      operationId: getHealth
      responses:
        "200":
          description: Process is up and the database answers a ping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Process is up but the database ping failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/auth/register:
    post:
      tags: [Auth]
      summary: Register with email and password
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created and tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate a refresh token
      description: |
        Presents a refresh token and receives a new access + refresh pair.
        The previous refresh token is revoked. Reuse of a revoked token in
        the same family revokes the entire family.
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Rotated tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke a refresh token
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Token revoked or already unknown
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/auth/sms/request:
    post:
      tags: [Auth]
      summary: Request an SMS login code (stub)
      description: |
        T1 ships an SMS stub, not a carrier integration. When
        `QINGXIN_SMS_STUB=1`, the response may include `dev_code` so
        automated tests can complete the flow. Production deployments MUST
        leave the stub disabled; the code is then only recorded through the
        `SmsSender` trait (log/no-op).
      operationId: requestSms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmsRequest"
      responses:
        "200":
          description: Code accepted for delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmsRequestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/auth/sms/verify:
    post:
      tags: [Auth]
      summary: Verify an SMS code and issue tokens
      description: Creates a user on first successful verify for that phone.
      operationId: verifySms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmsVerifyRequest"
      responses:
        "200":
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/me:
    get:
      tags: [Me]
      summary: Current principal
      operationId: getMe
      security:
        - bearerAuth: []
        - deviceAuth: []
      responses:
        "200":
          description: The authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/privacy/consent:
    get:
      tags: [Privacy]
      summary: Latest recorded privacy consent
      operationId: getConsent
      security:
        - bearerAuth: []
        - deviceAuth: []
      responses:
        "200":
          description: Latest consent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Privacy]
      summary: Record privacy-policy acceptance
      operationId: postConsent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentRequest"
      responses:
        "201":
          description: Consent stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/privacy/export:
    get:
      tags: [Privacy]
      summary: Export the caller's data as JSON
      operationId: exportData
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Portable export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportPayload"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/privacy/account:
    delete:
      tags: [Privacy]
      summary: Delete the caller's account and personal data
      operationId: deleteAccount
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Account erased
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/caregiver/invites:
    post:
      tags: [Caregiver]
      summary: Dependent creates a one-time caregiver invite
      operationId: createCaregiverInvite
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Invite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaregiverInvite"

  /v1/caregiver/accept:
    post:
      tags: [Caregiver]
      summary: Caregiver accepts an invite and links to the dependent
      operationId: acceptCaregiverInvite
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
      responses:
        "201":
          description: Link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaregiverLink"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/caregiver/links:
    get:
      tags: [Caregiver]
      summary: List caregiver links for the current user
      operationId: listCaregiverLinks
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Links where the caller is caregiver or dependent
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CaregiverLink"

  /v1/caregiver/links/{id}:
    delete:
      tags: [Caregiver]
      summary: Remove a caregiver link
      operationId: deleteCaregiverLink
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/devices:
    get:
      tags: [Devices]
      summary: List device sessions the caller can manage
      operationId: listDevices
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Device sessions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DeviceSession"
    post:
      tags: [Devices]
      summary: Issue a long-lived device session
      description: |
        A user may issue a device for themselves. A linked caregiver may
        issue a device for the dependent (`user_id` of the elder). The
        opaque token is returned once and stored only as a hash.
      operationId: createDevice
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeviceRequest"
      responses:
        "201":
          description: Device created; token shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSessionCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/devices/{id}:
    delete:
      tags: [Devices]
      summary: Revoke a device session
      operationId: revokeDevice
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/push/vapid-public-key:
    get:
      tags: [Push]
      summary: Application-server VAPID public key
      operationId: getVapidPublicKey
      responses:
        "200":
          description: Public key for `pushManager.subscribe`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapidPublicKey"

  /v1/push/subscribe:
    post:
      tags: [Push]
      summary: Store a Web Push subscription
      operationId: subscribePush
      security:
        - bearerAuth: []
        - deviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscribeRequest"
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscription"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/push/subscriptions/{id}:
    delete:
      tags: [Push]
      summary: Remove a Web Push subscription
      operationId: unsubscribePush
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/jobs:
    get:
      tags: [Jobs]
      summary: List the caller's scheduled jobs
      operationId: listJobs
      security:
        - bearerAuth: []
        - deviceAuth: []
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Job"
    post:
      tags: [Jobs]
      summary: Schedule a job (typically a Web Push reminder)
      operationId: createJob
      security:
        - bearerAuth: []
        - deviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
      responses:
        "201":
          description: Scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/jobs/{id}:
    delete:
      tags: [Jobs]
      summary: Cancel a pending job
      operationId: cancelJob
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Cancelled
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/ai/complete:
    post:
      tags: [AI]
      summary: Reserved AI completion seam
      description: |
        T1 does not implement a model gateway. The handler delegates to the
        `AiGateway` trait. The default `UnconfiguredAiGateway` returns 501
        `ai_unconfigured` so Echo can plug in providers later without
        changing the route.
      operationId: aiComplete
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiCompleteRequest"
      responses:
        "200":
          description: Completion from a configured gateway (not in T1)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiCompleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          description: Gateway not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /v1/finance/categories:
    get:
      tags: [Finance]
      summary: List system and user categories
      operationId: listFinanceCategories
      security:
        - bearerAuth: []
        - deviceAuth: []
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceCategoryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Finance]
      summary: Create a custom category
      operationId: createFinanceCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceCategoryWrite"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceCategory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/finance/categories/{id}:
    patch:
      tags: [Finance]
      summary: Rename a user-owned category
      operationId: patchFinanceCategory
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FinanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceCategoryPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceCategory"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Finance]
      summary: Delete a unused user-owned category
      operationId: deleteFinanceCategory
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FinanceId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/finance/transactions:
    get:
      tags: [Finance]
      summary: List transactions
      operationId: listFinanceTransactions
      security:
        - bearerAuth: []
        - deviceAuth: []
      parameters:
        - in: query
          name: month
          schema: { type: string, example: "2026-10" }
        - in: query
          name: type
          schema: { type: string, enum: [income, expense] }
        - in: query
          name: category_id
          schema: { type: string }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Page of transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTransactionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Finance]
      summary: Create a transaction (idempotent on client_id)
      operationId: createFinanceTransaction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceTransactionWrite"
      responses:
        "200":
          description: Existing row for the same client_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTransaction"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTransaction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/finance/transactions/{id}:
    get:
      tags: [Finance]
      summary: Get one transaction
      operationId: getFinanceTransaction
      security:
        - bearerAuth: []
        - deviceAuth: []
      parameters:
        - $ref: "#/components/parameters/FinanceId"
      responses:
        "200":
          description: Transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTransaction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Finance]
      summary: Update a transaction
      operationId: patchFinanceTransaction
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FinanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceTransactionPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTransaction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Finance]
      summary: Soft-delete a transaction
      operationId: deleteFinanceTransaction
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FinanceId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/finance/summary:
    get:
      tags: [Finance]
      summary: Monthly income, expense, budgets and recent entries
      operationId: getFinanceSummary
      security:
        - bearerAuth: []
        - deviceAuth: []
      parameters:
        - in: query
          name: month
          schema: { type: string, example: "2026-10" }
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/finance/report:
    get:
      tags: [Finance]
      summary: Category or month report with MoM and YoY
      operationId: getFinanceReport
      security:
        - bearerAuth: []
        - deviceAuth: []
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string, example: "2026-10" }
        - in: query
          name: to
          required: true
          schema: { type: string, example: "2026-10" }
        - in: query
          name: group
          schema: { type: string, enum: [category, month] }
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceReport"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/finance/budgets:
    get:
      tags: [Finance]
      summary: List budgets
      operationId: listFinanceBudgets
      security:
        - bearerAuth: []
        - deviceAuth: []
      responses:
        "200":
          description: Budgets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceBudgetList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Finance]
      summary: Bulk upsert budgets
      operationId: putFinanceBudgets
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceBudgetWrite"
      responses:
        "200":
          description: Upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceBudgetList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/finance/subscriptions:
    get:
      tags: [Finance]
      summary: List subscriptions
      operationId: listFinanceSubscriptions
      security:
        - bearerAuth: []
        - deviceAuth: []
      responses:
        "200":
          description: Subscriptions with annualised CNY cost
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceSubscriptionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Finance]
      summary: Create a subscription and schedule a web_push reminder
      operationId: createFinanceSubscription
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceSubscriptionWrite"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceSubscription"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/finance/subscriptions/upcoming:
    get:
      tags: [Finance]
      summary: Subscriptions due inside their reminder window
      operationId: listUpcomingFinanceSubscriptions
      security:
        - bearerAuth: []
        - deviceAuth: []
      parameters:
        - in: query
          name: days
          schema: { type: integer, default: 7 }
      responses:
        "200":
          description: Upcoming renewals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceSubscriptionList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/finance/subscriptions/{id}:
    patch:
      tags: [Finance]
      summary: Update a subscription
      operationId: patchFinanceSubscription
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FinanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceSubscriptionPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceSubscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Finance]
      summary: Delete a subscription
      operationId: deleteFinanceSubscription
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FinanceId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/finance/challenges:
    get:
      tags: [Finance]
      summary: List savings challenges
      operationId: listFinanceChallenges
      security:
        - bearerAuth: []
        - deviceAuth: []
      responses:
        "200":
          description: Challenges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceChallengeList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Finance]
      summary: Create a manual savings challenge
      operationId: createFinanceChallenge
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceChallengeWrite"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceChallenge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/finance/challenges/{id}:
    delete:
      tags: [Finance]
      summary: Delete a challenge
      operationId: deleteFinanceChallenge
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FinanceId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/finance/challenges/{id}/checkins:
    post:
      tags: [Finance]
      summary: Manual daily check-in (idempotent per day)
      operationId: checkinFinanceChallenge
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FinanceId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceCheckinWrite"
      responses:
        "200":
          description: Already checked in that day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceCheckin"
        "201":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceCheckin"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/finance/export.csv:
    get:
      tags: [Finance]
      summary: CSV export of the caller's ledger
      operationId: exportFinanceCsv
      security:
        - bearerAuth: []
      responses:
        "200":
          description: CSV
          content:
            text/csv:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access JWT from login, register, refresh, or SMS verify
    deviceAuth:
      type: http
      scheme: bearer
      description: |
        Opaque device session token issued by `POST /v1/devices`. Send as
        `Authorization: Device <token>` so it is not confused with a JWT.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FinanceId:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    NotFound:
      description: Resource missing
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Conflict:
      description: Unique constraint or already linked
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - invalid_credentials
                - unauthenticated
                - forbidden
                - not_found
                - conflict
                - ai_unconfigured
                - unavailable
            message:
              type: string
    HealthResponse:
      type: object
      required: [status, service, db]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
          example: qingxin-api
        db:
          type: string
          enum: [ok, error]
    User:
      type: object
      required: [id, display_name, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          nullable: true
        display_name:
          type: string
        phone:
          type: string
          nullable: true
          description: Decrypted E.164 phone when the caller is allowed to see it
        created_at:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      required: [email, password, display_name, consent]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        display_name:
          type: string
          minLength: 1
        consent:
          $ref: "#/components/schemas/ConsentRequest"
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    TokenResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Access-token lifetime in seconds
        user:
          $ref: "#/components/schemas/User"
    SmsRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          description: E.164 phone number
          example: "+8613800138000"
        consent:
          $ref: "#/components/schemas/ConsentRequest"
    SmsRequestResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [sent]
        dev_code:
          type: string
          description: Present only when the SMS stub is enabled
    SmsVerifyRequest:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
        code:
          type: string
        display_name:
          type: string
        consent:
          $ref: "#/components/schemas/ConsentRequest"
    ConsentRequest:
      type: object
      required: [policy_version]
      properties:
        policy_version:
          type: string
          example: "2026-10-13"
    Consent:
      type: object
      required: [id, user_id, policy_version, accepted_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        policy_version:
          type: string
        accepted_at:
          type: string
          format: date-time
    ExportPayload:
      type: object
      required: [exported_at, user, consents, devices, jobs, push_subscriptions, finance]
      properties:
        exported_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
        consents:
          type: array
          items:
            $ref: "#/components/schemas/Consent"
        devices:
          type: array
          items:
            $ref: "#/components/schemas/DeviceSession"
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        push_subscriptions:
          type: array
          items:
            $ref: "#/components/schemas/PushSubscription"
        finance:
          $ref: "#/components/schemas/FinanceExport"
    CaregiverInvite:
      type: object
      required: [code, expires_at]
      properties:
        code:
          type: string
        expires_at:
          type: string
          format: date-time
    AcceptInviteRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
    CaregiverLink:
      type: object
      required: [id, caregiver_user_id, dependent_user_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        caregiver_user_id:
          type: string
          format: uuid
        dependent_user_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    CreateDeviceRequest:
      type: object
      required: [label]
      properties:
        user_id:
          type: string
          format: uuid
          description: Target user; defaults to the caller
        label:
          type: string
          example: 客厅平板
        ttl_seconds:
          type: integer
          description: Optional lifetime; default 31536000 (365 days)
    DeviceSession:
      type: object
      required: [id, user_id, issued_by_user_id, label, expires_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        issued_by_user_id:
          type: string
          format: uuid
        label:
          type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    DeviceSessionCreated:
      allOf:
        - $ref: "#/components/schemas/DeviceSession"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: Opaque device credential; shown once
    VapidPublicKey:
      type: object
      required: [public_key]
      properties:
        public_key:
          type: string
    PushSubscribeRequest:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint:
          type: string
          format: uri
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh:
              type: string
            auth:
              type: string
    PushSubscription:
      type: object
      required: [id, endpoint, created_at]
      properties:
        id:
          type: string
          format: uuid
        endpoint:
          type: string
        created_at:
          type: string
          format: date-time
    CreateJobRequest:
      type: object
      required: [kind, run_at]
      properties:
        kind:
          type: string
          enum: [web_push]
        run_at:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
          description: JSON delivered to the push sender (title, body, …)
    Job:
      type: object
      required: [id, user_id, kind, run_at, status, attempts, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        kind:
          type: string
        run_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, running, done, failed, cancelled]
        attempts:
          type: integer
        payload:
          type: object
          additionalProperties: true
        last_error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    AiCompleteRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            type: object
            required: [role, content]
            properties:
              role:
                type: string
                enum: [system, user, assistant]
              content:
                type: string
        model:
          type: string
    AiCompleteResponse:
      type: object
      required: [content]
      properties:
        content:
          type: string
        model:
          type: string
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
    FinanceCategory:
      type: object
      required: [id, name, kind, sort_order, system]
      properties:
        id: { type: string }
        user_id: { type: string, nullable: true }
        name: { type: string }
        kind: { type: string, enum: [income, expense] }
        sort_order: { type: integer }
        system: { type: boolean }
    FinanceCategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FinanceCategory"
    FinanceCategoryWrite:
      type: object
      required: [name, kind]
      properties:
        name: { type: string }
        kind: { type: string, enum: [income, expense] }
    FinanceCategoryPatch:
      type: object
      properties:
        name: { type: string }
    FinanceTransaction:
      type: object
      required: [id, amount_fen, currency, type, category_id, occurred_on, client_id]
      properties:
        id: { type: string }
        amount_fen: { type: integer }
        currency: { type: string, enum: [CNY] }
        type: { type: string, enum: [income, expense] }
        category_id: { type: string }
        category_name: { type: string }
        note: { type: string, nullable: true }
        occurred_on: { type: string, format: date }
        client_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FinanceTransactionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FinanceTransaction"
        next_cursor: { type: string, nullable: true }
    FinanceTransactionWrite:
      type: object
      required: [amount_fen, type, category_id, occurred_on, client_id]
      properties:
        amount_fen: { type: integer, exclusiveMinimum: 0 }
        currency: { type: string, enum: [CNY] }
        type: { type: string, enum: [income, expense] }
        category_id: { type: string }
        note: { type: string, maxLength: 200 }
        occurred_on: { type: string, format: date }
        client_id: { type: string, format: uuid }
    FinanceTransactionPatch:
      type: object
      properties:
        amount_fen: { type: integer, exclusiveMinimum: 0 }
        type: { type: string, enum: [income, expense] }
        category_id: { type: string }
        note: { type: string, maxLength: 200 }
        occurred_on: { type: string, format: date }
    FinanceBudget:
      type: object
      required: [id, monthly_limit_fen, alert_threshold_pct, currency]
      properties:
        id: { type: string }
        category_id: { type: string, nullable: true }
        category_name: { type: string, nullable: true }
        monthly_limit_fen: { type: integer }
        alert_threshold_pct: { type: integer }
        spent_fen: { type: integer }
        pct: { type: integer }
        alert: { type: boolean }
        currency: { type: string, enum: [CNY] }
    FinanceBudgetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FinanceBudget"
    FinanceBudgetWrite:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [monthly_limit_fen]
            properties:
              category_id: { type: string, nullable: true }
              monthly_limit_fen: { type: integer, exclusiveMinimum: 0 }
              alert_threshold_pct: { type: integer, minimum: 1, maximum: 100 }
    FinanceSummary:
      type: object
      required: [month, currency, income_fen, expense_fen, balance_fen, by_category, budgets, recent]
      properties:
        month: { type: string }
        currency: { type: string, enum: [CNY] }
        income_fen: { type: integer }
        expense_fen: { type: integer }
        balance_fen: { type: integer }
        by_category:
          type: array
          items:
            type: object
        budgets:
          type: array
          items:
            $ref: "#/components/schemas/FinanceBudget"
        recent:
          type: array
          items:
            $ref: "#/components/schemas/FinanceTransaction"
    FinanceReport:
      type: object
      required: [from, to, currency, mom, yoy]
      properties:
        from: { type: string }
        to: { type: string }
        group: { type: string }
        currency: { type: string, enum: [CNY] }
        income_fen: { type: integer }
        expense_fen: { type: integer }
        mom:
          type: object
          required: [expense_delta_fen]
          properties:
            expense_fen: { type: integer }
            expense_delta_fen: { type: integer }
            expense_delta_pct: { type: integer }
        yoy:
          type: object
          required: [expense_delta_fen]
          properties:
            expense_fen: { type: integer }
            expense_delta_fen: { type: integer }
            expense_delta_pct: { type: integer }
        slices:
          type: array
          items:
            type: object
    FinanceSubscription:
      type: object
      required: [id, name, price_fen, currency, cycle, next_billing_date, annual_cost_fen]
      properties:
        id: { type: string }
        name: { type: string }
        price_fen: { type: integer }
        currency: { type: string, enum: [CNY] }
        cycle: { type: string, enum: [weekly, monthly, quarterly, yearly] }
        next_billing_date: { type: string, format: date }
        remind_days_before: { type: integer }
        active: { type: boolean }
        annual_cost_fen: { type: integer }
    FinanceSubscriptionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FinanceSubscription"
    FinanceSubscriptionWrite:
      type: object
      required: [name, price_fen, cycle, next_billing_date]
      properties:
        name: { type: string }
        price_fen: { type: integer, exclusiveMinimum: 0 }
        currency: { type: string, enum: [CNY] }
        cycle: { type: string, enum: [weekly, monthly, quarterly, yearly] }
        next_billing_date: { type: string, format: date }
        remind_days_before: { type: integer }
        active: { type: boolean }
    FinanceSubscriptionPatch:
      type: object
      properties:
        name: { type: string }
        price_fen: { type: integer, exclusiveMinimum: 0 }
        cycle: { type: string, enum: [weekly, monthly, quarterly, yearly] }
        next_billing_date: { type: string, format: date }
        remind_days_before: { type: integer }
        active: { type: boolean }
    FinanceChallenge:
      type: object
      required: [id, name, target_days, start_date, progress_days]
      properties:
        id: { type: string }
        name: { type: string }
        target_days: { type: integer }
        target_amount_fen: { type: integer, nullable: true }
        start_date: { type: string, format: date }
        progress_days: { type: integer }
        created_at: { type: string, format: date-time }
        checkins:
          type: array
          items:
            $ref: "#/components/schemas/FinanceCheckin"
    FinanceChallengeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FinanceChallenge"
    FinanceChallengeWrite:
      type: object
      required: [name, target_days]
      properties:
        name: { type: string }
        target_days: { type: integer, exclusiveMinimum: 0 }
        target_amount_fen: { type: integer }
        start_date: { type: string, format: date }
    FinanceCheckin:
      type: object
      required: [id, challenge_id, day]
      properties:
        id: { type: string }
        challenge_id: { type: string }
        day: { type: string, format: date }
        created_at: { type: string, format: date-time }
    FinanceCheckinWrite:
      type: object
      properties:
        day: { type: string, format: date }
    FinanceExport:
      type: object
      required: [categories, transactions, budgets, subscriptions, challenges]
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/FinanceCategory"
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/FinanceTransaction"
        budgets:
          type: array
          items:
            $ref: "#/components/schemas/FinanceBudget"
        subscriptions:
          type: array
          items:
            $ref: "#/components/schemas/FinanceSubscription"
        challenges:
          type: array
          items:
            $ref: "#/components/schemas/FinanceChallenge"
