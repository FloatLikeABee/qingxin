components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access JWT from login, register, refresh, or SMS verify
    deviceAuth:
      type: http
      scheme: bearer
      description: |
        Opaque device session token issued by `POST /v1/devices`. Send as
        `Authorization: Device <token>` so it is not confused with a JWT.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ElderId:
      name: elder_id
      in: path
      required: true
      schema:
        type: string
      description: Elder user id, or `me` for the caller
    FinanceId:
      name: id
      in: path
      required: true
      schema:
        type: string
    WellnessId:
      name: id
      in: path
      required: true
      schema:
        type: string
    StudyId:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    NotFound:
      description: Resource missing
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Conflict:
      description: Unique constraint or already linked
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    NotImplemented:
      description: AI gateway is not configured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - invalid_credentials
                - unauthenticated
                - forbidden
                - not_found
                - conflict
                - ai_unconfigured
                - unavailable
            message:
              type: string
    HealthResponse:
      type: object
      required: [status, service, db]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
          example: qingxin-api
        db:
          type: string
          enum: [ok, error]
    User:
      type: object
      required: [id, display_name, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          nullable: true
        display_name:
          type: string
        phone:
          type: string
          nullable: true
          description: Decrypted E.164 phone when the caller is allowed to see it
        created_at:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      required: [email, password, display_name, consent]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        display_name:
          type: string
          minLength: 1
        consent:
          $ref: "#/components/schemas/ConsentRequest"
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    TokenResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Access-token lifetime in seconds
        user:
          $ref: "#/components/schemas/User"
    SmsRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          description: E.164 phone number
          example: "+8613800138000"
        consent:
          $ref: "#/components/schemas/ConsentRequest"
    SmsRequestResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [sent]
        dev_code:
          type: string
          description: Present only when the SMS stub is enabled
    SmsVerifyRequest:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
        code:
          type: string
        display_name:
          type: string
        consent:
          $ref: "#/components/schemas/ConsentRequest"
    ConsentRequest:
      type: object
      required: [policy_version]
      properties:
        policy_version:
          type: string
          example: "2026-10-13"
    Consent:
      type: object
      required: [id, user_id, policy_version, accepted_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        policy_version:
          type: string
        accepted_at:
          type: string
          format: date-time
    ExportPayload:
      type: object
      required: [exported_at, user, consents, devices, jobs, push_subscriptions]
      properties:
        exported_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
        consents:
          type: array
          items:
            $ref: "#/components/schemas/Consent"
        devices:
          type: array
          items:
            $ref: "#/components/schemas/DeviceSession"
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        push_subscriptions:
          type: array
          items:
            $ref: "#/components/schemas/PushSubscription"
        finance:
          $ref: "#/components/schemas/FinanceExport"
        wellness:
          $ref: "#/components/schemas/WellnessExport"
        study:
          $ref: "#/components/schemas/StudyExport"
        local_reviews:
          type: array
          items:
            $ref: "#/components/schemas/LocalReview"
        local_services:
          type: array
          items:
            $ref: "#/components/schemas/LocalService"
        local_corrections:
          type: array
          items:
            $ref: "#/components/schemas/LocalCorrection"
    CaregiverInvite:
      type: object
      required: [code, expires_at]
      properties:
        code:
          type: string
