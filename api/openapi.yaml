openapi: 3.1.0
info:
  title: Qingxin (轻心) API
  version: 0.2.0
  description: |
    T1 Foundation HTTP contract for Qingxin, plus M1 mood/meditation, M2 finance, M3 elder-assistant, M4 local-life, M7 wellness, M8 study, and M10 hustle routes.

    The Rust service lives in `api/`. Sensitive fields (phone numbers,
    finance transaction notes, wellness symptoms/sleep notes/report metrics,
    and study flashcard faces plus note Markdown)
    are stored with AES-256-GCM. Access tokens are short-lived JWTs; refresh
    tokens and caregiver-issued device sessions are opaque, hashed, and
    revocable. M2 finance lives at `/v1/finance` (CNY fen amounts stay plaintext).
    M7 wellness lives at `/v1/wellness` (owner-only; caregivers never see it).
    Cycle symptoms, sleep notes and report metrics use `*_encrypted` BLOB columns
    (`symptoms_encrypted`, `note_encrypted`, `metrics_encrypted`).
    M8 study lives at `/v1/study` (owner-only). Flashcard fronts/backs and
    study-note Markdown use `front_encrypted`, `back_encrypted`, and
    `content_md_encrypted`.

    AI generation is intentionally a seam: `POST /v1/ai/complete` is reserved
    for Echo's gateway and returns `ai_unconfigured` until that crate is
    wired. Moderation is an in-process trait (no-op stub) and is not exposed
    as a public route in T1.
  license:
    name: UNLICENSED
servers:
  - url: http://127.0.0.1:8080
    description: Local development
security: []
tags:
  - name: Health
  - name: Auth
  - name: Me
  - name: Privacy
  - name: Caregiver
  - name: Devices
  - name: Push
  - name: Jobs
  - name: AI
  - name: Finance
  - name: Elder
  - name: Mood
  - name: Meditation
  - name: Hustle
  - name: Wellness
  - name: Local
  - name: Study
paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness and database readiness
      operationId: getHealth
      responses:
        "200":
          description: Process is up and the database answers a ping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Process is up but the database ping failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/auth/register:
    post:
      tags: [Auth]
      summary: Register with email and password
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created and tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate a refresh token
      description: |
        Presents a refresh token and receives a new access + refresh pair.
        The previous refresh token is revoked. Reuse of a revoked token in
        the same family revokes the entire family.
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Rotated tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke a refresh token
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Token revoked or already unknown
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/auth/sms/request:
    post:
      tags: [Auth]
      summary: Request an SMS login code (stub)
      description: |
        T1 ships an SMS stub, not a carrier integration. When
        `QINGXIN_SMS_STUB=1`, the response may include `dev_code` so
        automated tests can complete the flow. Production deployments MUST
        leave the stub disabled; the code is then only recorded through the
        `SmsSender` trait (log/no-op).
      operationId: requestSms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmsRequest"
      responses:
        "200":
          description: Code accepted for delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmsRequestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/auth/sms/verify:
    post:
      tags: [Auth]
      summary: Verify an SMS code and issue tokens
      description: Creates a user on first successful verify for that phone.
      operationId: verifySms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmsVerifyRequest"
      responses:
        "200":
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/me:
    get:
      tags: [Me]
      summary: Current principal
      operationId: getMe
      security:
        - bearerAuth: []
        - deviceAuth: []
      responses:
        "200":
          description: The authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/privacy/consent:
    get:
      tags: [Privacy]
      summary: Latest recorded privacy consent
      operationId: getConsent
      security:
        - bearerAuth: []
        - deviceAuth: []
      responses:
        "200":
          description: Latest consent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Privacy]
      summary: Record privacy-policy acceptance
      operationId: postConsent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentRequest"
      responses:
        "201":
          description: Consent stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/privacy/export:
    get:
      tags: [Privacy]
      summary: Export the caller's data as JSON
      operationId: exportData
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Portable export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportPayload"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/privacy/account:
    delete:
      tags: [Privacy]
      summary: Delete the caller's account and personal data
      operationId: deleteAccount
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Account erased
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/caregiver/invites:
    post:
      tags: [Caregiver]
      summary: Dependent creates a one-time caregiver invite
      operationId: createCaregiverInvite
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Invite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaregiverInvite"

  /v1/caregiver/accept:
    post:
      tags: [Caregiver]
      summary: Caregiver accepts an invite and links to the dependent
      operationId: acceptCaregiverInvite
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
      responses:
        "201":
          description: Link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaregiverLink"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/caregiver/links:
    get:
      tags: [Caregiver]
      summary: List caregiver links for the current user
      operationId: listCaregiverLinks
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Links where the caller is caregiver or dependent
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CaregiverLink"

  /v1/caregiver/links/{id}:
    delete:
      tags: [Caregiver]
      summary: Remove a caregiver link
      operationId: deleteCaregiverLink
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/devices:
    get:
      tags: [Devices]
      summary: List device sessions the caller can manage
      operationId: listDevices
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Device sessions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DeviceSession"
    post:
      tags: [Devices]
      summary: Issue a long-lived device session
      description: |
        A user may issue a device for themselves. A linked caregiver may
        issue a device for the dependent (`user_id` of the elder). The
        opaque token is returned once and stored only as a hash.
      operationId: createDevice
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeviceRequest"
      responses:
        "201":
          description: Device created; token shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSessionCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/devices/{id}:
    delete:
      tags: [Devices]
      summary: Revoke a device session
      operationId: revokeDevice
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/push/vapid-public-key:
    get:
      tags: [Push]
      summary: Application-server VAPID public key
      operationId: getVapidPublicKey
      responses:
        "200":
          description: Public key for `pushManager.subscribe`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapidPublicKey"

  /v1/push/subscribe:
    post:
      tags: [Push]
      summary: Store a Web Push subscription
      operationId: subscribePush
      security:
        - bearerAuth: []
        - deviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscribeRequest"
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscription"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/push/subscriptions/{id}:
    delete:
      tags: [Push]
      summary: Remove a Web Push subscription
      operationId: unsubscribePush
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/jobs:
    get:
      tags: [Jobs]
      summary: List the caller's scheduled jobs
      operationId: listJobs
      security:
        - bearerAuth: []
        - deviceAuth: []
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Job"
    post:
      tags: [Jobs]
      summary: Schedule a job (typically a Web Push reminder)
      operationId: createJob
      security:
        - bearerAuth: []
        - deviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
      responses:
        "201":
          description: Scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/jobs/{id}:
    delete:
      tags: [Jobs]
      summary: Cancel a pending job
      operationId: cancelJob
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Cancelled
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/ai/complete:
    post:
      tags: [AI]
      summary: Reserved AI completion seam
      description: |
        T1 does not implement a model gateway. The handler delegates to the
        `AiGateway` trait. The default `UnconfiguredAiGateway` returns 501
        `ai_unconfigured` so Echo can plug in providers later without
        changing the route.
      operationId: aiComplete
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiCompleteRequest"
      responses:
        "200":
          description: Completion from a configured gateway (not in T1)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiCompleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          description: Gateway not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /v1/elder/today:
    get:
      tags: [Elder]
      summary: Elder home aggregate
      description: |
        Returns today's reminders, due occurrences, contacts (including 120/110),
        and a disclaimer that reminders are not alarm-reliable.
        `elder_id` defaults to the caller (`me`). Device sessions authenticate as the elder.
      operationId: getElderToday
      security:
        - bearerAuth: []
        - deviceAuth: []
      parameters:
        - name: elder_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Today payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElderToday"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/elder/{elder_id}/profile:
    get:
      tags: [Elder]
      summary: Elder profile including activity-log opt-in
      operationId: getElderProfile
      security:
        - bearerAuth: []
        - deviceAuth: []
      parameters:
        - $ref: "#/components/parameters/ElderId"
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElderProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Elder]
      summary: Elder updates their own profile
      description: Only the elder may change `activity_log_opt_in`. Caregivers receive 404.
      operationId: patchElderProfile
      security:
        - bearerAuth: []
        - deviceAuth: []
      parameters:
        - $ref: "#/components/parameters/ElderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ElderProfilePatch"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElderProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/elder/{elder_id}/reminders:
    get:
      tags: [Elder]
      summary: List reminders
      operationId: listElderReminders
      security:
        - bearerAuth: []
        - deviceAuth: []
      parameters:
        - $ref: "#/components/parameters/ElderId"
      responses:
        "200":
          description: Reminder list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElderReminderList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Elder]
      summary: Create a time-plus-weekday reminder
      description: Rejects `schedule_cron`. Enqueues T1 `web_push` jobs for the next occurrence and a miss-check.
      operationId: createElderReminder
      security:
        - bearerAuth: []
        - deviceAuth: []
      parameters:
        - $ref: "#/components/parameters/ElderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ElderReminderCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElderReminder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/elder/{elder_id}/reminders/{id}:
    patch:
      tags: [Elder]
      operationId: patchElderReminder
      security:
        - bearerAuth: []
        - deviceAuth: []
      parameters:
        - $ref: "#/components/parameters/ElderId"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ElderReminderCreate"
      responses:
        "200":
          description: Updated reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElderReminder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Elder]
      operationId: deleteElderReminder
      security:
        - bearerAuth: []
        - deviceAuth: []
      parameters:
        - $ref: "#/components/parameters/ElderId"
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/elder/{elder_id}/reminders/{id}/ack:
    post:
      tags: [Elder]
      summary: Acknowledge a reminder occurrence (idempotent)
      operationId: ackElderReminder
      security:
        - bearerAuth: []
        - deviceAuth: []
      parameters:
        - $ref: "#/components/parameters/ElderId"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [occurrence_at]
              properties:
                occurrence_at:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Ack event
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/elder/{elder_id}/contacts:
    get:
      tags: [Elder]
      summary: List contacts including 120 and 110
      operationId: listElderContacts
      security:
        - bearerAuth: []
        - deviceAuth: []
      parameters:
        - $ref: "#/components/parameters/ElderId"
      responses:
        "200":
          description: Contacts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElderContactList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Elder]
      summary: Create a contact (phone AES-GCM at rest)
      operationId: createElderContact
      security:
        - bearerAuth: []
        - deviceAuth: []
      parameters:
        - $ref: "#/components/parameters/ElderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ElderContactCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElderContact"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/elder/tutorials/system:
    get:
      tags: [Elder]
      summary: System tutorials
      operationId: listElderSystemTutorials
      security:
        - bearerAuth: []
        - deviceAuth: []
      responses:
        "200":
          description: System tutorials
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/elder/{elder_id}/tutorials:
    get:
      tags: [Elder]
      summary: Family-authored tutorials
      operationId: listElderFamilyTutorials
      security:
        - bearerAuth: []
        - deviceAuth: []
      parameters:
        - $ref: "#/components/parameters/ElderId"
      responses:
        "200":
          description: Family tutorials
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Elder]
      operationId: createElderTutorial
      security:
        - bearerAuth: []
        - deviceAuth: []
      parameters:
        - $ref: "#/components/parameters/ElderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, steps]
              properties:
                title:
                  type: string
                steps:
                  type: array
                  items:
                    $ref: "#/components/schemas/ElderTutorialStep"
      responses:
        "201":
          description: Created
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/elder/fraud-scripts:
    get:
      tags: [Elder]
      summary: Search sourced anti-fraud cards
      operationId: listFraudScripts
      security:
        - bearerAuth: []
        - deviceAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Fraud scripts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FraudScriptList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/elder/fraud-scripts/{id}:
    patch:
      tags: [Elder]
      summary: Editor-only update of a fraud script
      operationId: patchFraudScript
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FraudScript"
      responses:
        "200":
          description: Updated
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
