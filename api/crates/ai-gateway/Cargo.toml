[package]
name = "qingxin-ai-gateway"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Qingxin (轻心) AI gateway: providers, fallback, cache, rate limit, SSE, tokens"
license = "MIT"
publish = false

[dependencies]
async-trait = "0.1"
futures = "0.3"
hex = "0.4"
reqwest = { version = "=0.12.9", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
