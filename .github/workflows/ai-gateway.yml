name: ai-gateway

on:
  push:
    branches: [main]
    paths:
      - 'api/crates/ai-gateway/**'
      - '.github/workflows/ai-gateway.yml'
  pull_request:
    branches: [main]
    paths:
      - 'api/crates/ai-gateway/**'
      - '.github/workflows/ai-gateway.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/crates/ai-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
