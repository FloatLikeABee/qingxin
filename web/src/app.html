<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#3B82F6" />
		<meta
			name="description"
			content="轻心 —— 把日子过轻一点。工具辅助与信息展示，非医疗、金融或法律建议。"
		/>
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<script>
			(function () {
				try {
					var mode = localStorage.getItem('qingxin.theme') || 'system';
					var hour = new Date().getHours();
					var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					var dark =
						mode === 'dark' ||
						(mode === 'system' && prefersDark) ||
						(mode === 'night-only' && (hour >= 19 || hour < 7));
					var root = document.documentElement;
					root.classList.toggle('dark', dark);
					root.style.colorScheme = dark ? 'dark' : 'light';
					var meta = document.querySelector('meta[name="color-scheme"]');
					if (meta)
						meta.setAttribute(
							'content',
							mode === 'system' ? 'light dark' : dark ? 'dark' : 'light'
						);
					var theme = document.querySelector('meta[name="theme-color"]');
					if (theme) theme.setAttribute('content', dark ? '#111827' : '#3B82F6');
					if (localStorage.getItem('qingxin.elderMode') === '1') root.classList.add('elder');
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
